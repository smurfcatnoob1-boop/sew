apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        // KRİTİK: NDK Sürümünü ve ABI'leri belirtiyoruz
        ndk {
            // NDK'nın hangi API seviyesi için derleme yapacağını belirtir.
            abiFilters 'armeabi-v7a', 'arm64-v8a' 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinleştirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            
            // HATA DÜZELTİLDİ: Argümanları tekil 'arg' satırları olarak tanımlıyoruz
            // Bu, AGP 8.x ve Groovy DSL için en kararlı yoldur.
            arguments {
                arg '-DANDROID_TOOLCHAIN=clang'
                arg '-DANDROID_STL=c++_static'
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
