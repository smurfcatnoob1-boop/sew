apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        // KRITIK: NDK Surumunu belirtiyoruz
        ndk {
            // NDK'nın hangi API seviyesi icin derleme yapacagini belirtir.
            // native_app_glue kutuphanesi API 9'dan beri vardir, minSdk ile uyumlu olmalidir.
            abiFilters 'armeabi-v7a', 'arm64-v8a' 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinlestirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            
            // KRITIK: CMake'e ek argumanlar gonderiyoruz
            defaultArgs [
                '-DANDROID_TOOLCHAIN=clang',
                '-DANDROID_STL=c++_static',
                // NDK kutuphanelerinin aranacagi yollari guclendiriyoruz
                '-DANDROID_NATIVE_LIB_DIR=${ANDROID_NDK}/sources/android/native_app_glue'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
