apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        // NDK Sürümünü ve ABI'leri belirtiyoruz
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a' 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinleştirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            
            // HATA DÜZELTİLDİ: Argümanları method çağrısı ile tek tek ekliyoruz
            arguments(
                '-DANDROID_TOOLCHAIN=clang', 
                '-DANDROID_STL=c++_static'
            )
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
