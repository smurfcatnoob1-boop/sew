apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        // KRİTİK: NDK Sürümünü belirtiyoruz
        ndk {
            # NDK'nın hangi API seviyesi için derleme yapacağını belirtir.
            # native_app_glue kütüphanesi API 9'dan beri vardır, minSdk ile uyumlu olmalıdır.
            abiFilters 'armeabi-v7a', 'arm64-v8a' 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinleştirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            
            // KRİTİK: CMake'e ek argümanlar gönderiyoruz
            defaultArgs [
                '-DANDROID_TOOLCHAIN=clang',
                '-DANDROID_STL=c++_static',
                # NDK kütüphanelerinin aranacağı yolları güçlendiriyoruz
                '-DANDROID_NATIVE_LIB_DIR=${ANDROID_NDK}/sources/android/native_app_glue'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
