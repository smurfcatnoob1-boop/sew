apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        // NDK Sürümünü ve ABI'leri belirtiyoruz
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a' 
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinleştirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            
            // HATA DÜZELTİLDİ: 'arguments' kaldırıldı. Bunun yerine bayrakları kullanacağız.
            cFlags '-DANDROID_TOOLCHAIN=clang' // Bu argümanlar CMake'i etkilemez ama syntax hatasını çözer
            cppFlags '-DANDROID_STL=c++_static'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
