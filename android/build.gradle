apply plugin: 'com.android.application'

android {
    namespace 'com.sevgili.oyunu'
    compileSdk 33

    defaultConfig {
        applicationId "com.sevgili.oyunu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake/NDK Derlemesini Etkinleştirme
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
